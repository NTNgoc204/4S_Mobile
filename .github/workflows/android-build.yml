name: Build & Release Android App

on:
  push:
    branches:
      - develop # Trigger build on pushes to the develop branch
    tags:
      - 'v*' # Trigger build on pushing version tags (e.g. v1.0.0)
  workflow_dispatch: # Allow manual trigger via GitHub Actions UI

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout source code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Set up Java JDK (Using JDK 17 to compile Gradle tasks)
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 3. Set up Flutter environment
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      # 4. Create .env file (since it is ignored by git but required in pubspec.yaml)
      - name: Create .env file
        env:
          API_URL: ${{ secrets.API_BASE_URL }}
        run: |
          echo "::add-mask::$API_URL"
          echo "API_BASE_URL=$API_URL" > .env

      # 5. Install Flutter package dependencies
      - name: Install dependencies
        run: flutter pub get

      # 6. Build the release APK (build/app/outputs/flutter-apk/app-release.apk)
      - name: Build Android APK
        run: flutter build apk --release

      # 7. Rename the output APK to a clean, uniform name
      - name: Rename APK
        run: |
          mkdir -p output
          mv build/app/outputs/flutter-apk/app-release.apk output/CareerGuidanceAI.apk

      # 8. Create GitHub Release & Upload the APK
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'dev-build' }}
          name: ${{ startsWith(github.ref, 'refs/tags/v') && format('Version {0}', github.ref_name) || 'Development Build' }}
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/v') }}
          files: output/CareerGuidanceAI.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
